[project]
name = "simplecooking-recipe-db"
version = "0.1.0"
description = "Incrementally build a structured recipe database from a YouTube cooking channel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp[curl-cffi,default]>=2025.10.22",
]

[project.scripts]
recipe-db = "recipe_db.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_db"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

